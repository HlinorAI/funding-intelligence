  - technical milestone plan
  - commercialisation or technology transfer path
  - pilot, license, patent or entity-formation outcome target
score: {strategic_fit: 25, evidence: 20, mechanism_fit: 15}
failure_modes:
  - confusing research acceleration with a normal startup accelerator
  - no measurable technology-transfer outcome
  - solicitation eligibility not confirmed
