best_fit:
  - deep-tech company with a defensible technology and commercialisation plan
  - startup with validation, market evidence and a scale-up milestone
  - team able to separate grant-funded work from equity financing
bad_fit:
  - generic SaaS without a deep-tech innovation claim
  - grant request framed only as unrestricted runway
  - no technical validation or route-specific cut-off fit
required_evidence:
  - technical novelty and validation evidence
  - market and customer adoption evidence
  - commercialisation milestones and budget
  - legal entity, ownership and funding history
score: {strategic_fit: 25, evidence: 20, mechanism_fit: 15}
failure_modes:
  - confusing grant eligibility with equity readiness
  - missing the applicable cut-off or submission stage
  - overstating technology readiness
next_action:
  action: VERIFY
  deliverable: "Map the project to the 2026 EIC cut-off, grant/equity route and commercialisation evidence"
  horizon_days: 3
stop_condition: "No deep-tech novelty, validation or matching EIC application window"
