name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml
          pip install -r tests/requirements-test.txt

      - name: Schema validation
        run: python runtime/validate_schemas.py

      - name: Health check self-test
        run: python runtime/health_check.py --self-test

      - name: Runner tests
        run: python -m pytest tests/test_runner.py -v --tb=short

      - name: Benchmark smoke test
        run: python runtime/run_benchmarks.py

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install linting tools
        run: |
          python -m pip install --upgrade pip
          pip install yamllint

      - name: Lint YAML schemas
        run: yamllint schemas/*.yaml --no-warnings || true

      - name: Lint Python
        run: |
          pip install flake8
          flake8 runtime/ tests/ --max-line-length=100 --ignore=E501,F821,W503
